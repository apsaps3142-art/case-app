<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Касса</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; background: #18191d; color: #fff; padding: 20px; text-align: center; }
    .card { background: #23252b; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    input { width: 90%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #3a3d46; background: #121316; color: #fff; font-size: 16px; }
    button { background: #0088cc; color: #fff; border: none; border-radius: 8px; padding: 14px; width: 95%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <h2 id="title">Касса 24/7</h2>
    <input type="number" id="sum" placeholder="Сумма (сомони)">
    <input type="text" id="desc" placeholder="Описание товара / заказа">
    <button id="btn">Зафиксировать запись</button>
  </div>
  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    document.getElementById('btn').onclick = function() {
      const sum = document.getElementById('sum').value;
      const desc = document.getElementById('desc').value;
      if (!sum) { tg.showAlert('Введите сумму!'); return; }
      tg.sendData(JSON.stringify({ sum: sum, desc: desc }));
    };
  </script>
</body>
</html>
