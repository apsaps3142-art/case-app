<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Касса Магазина</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --btn: var(--tg-theme-button-color, #38bdf8);
      --btn-text: var(--tg-theme-button-text-color, #0f172a);
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    }
    .stat-card .title { font-size: 13px; color: var(--hint); }
    .stat-card .val { font-size: 20px; font-weight: 700; margin-top: 4px; color: var(--btn); }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      background: var(--card-bg);
      color: var(--text);
      font-size: 16px;
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--btn);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: var(--btn);
      color: var(--btn-text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: opacity 0.2s;
    }
    .btn-submit:disabled { opacity: 0.5; }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 24px 0 12px;
    }
    .history-header h3 { margin: 0; font-size: 16px; }
    .history-header span { font-size: 12px; color: var(--hint); }

    .item-list { display: flex; flex-direction: column; gap: 8px; }
    .item-card {
      background: var(--card-bg);
      padding: 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-info .name { font-size: 15px; font-weight: 500; }
    .item-info .time { font-size: 12px; color: var(--hint); margin-top: 2px; }
    .item-amount { font-size: 16px; font-weight: 700; color: var(--success); }

    .status-msg {
      text-align: center;
      font-size: 12px;
      margin-top: 8px;
      min-height: 16px;
      color: var(--hint);
    }
  </style>
</head>
<body>

  <!-- Статистика -->
  <div class="grid-stats">
    <div class="stat-card">
      <div class="title">Выручка сегодня</div>
      <div class="val" id="todayTotal">0 TJS</div>
    </div>
    <div class="stat-card">
      <div class="title">Чеков сегодня</div>
      <div class="val" id="todayCount">0</div>
    </div>
  </div>

  <!-- Форма внесения -->
  <div class="form-group">
    <label>Товар / Описание</label>
    <input type="text" id="desc" placeholder="Например: Чехол силиконовый" autocomplete="off">
  </div>

  <div class="form-group">
    <label>Сумма (TJS)</label>
    <input type="number" id="amount" placeholder="0" inputmode="numeric">
  </div>

  <div class="form-group">
    <label>Продавец</label>
    <select id="seller">
      <option value="Владелец">Владелец</option>
      <option value="Продавец 1">Продавец 1</option>
      <option value="Продавец 2">Продавец 2</option>
    </select>
  </div>

  <button class="btn-submit" id="saveBtn" onclick="submitSale()">Внести в кассу</button>
  <div class="status-msg" id="statusMsg"></div>

  <!-- Лента последних продаж -->
  <div class="history-header">
    <h3>История операций</h3>
    <span id="allCount">Локально: 0</span>
  </div>
  <div class="item-list" id="historyList"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwG88kW4pG38mi-5CDWFY2IzVIOTDx5iIq7l3S5IMQ1T6c9FKlc19SMSmQINKX2xFiQ/exec";
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    let sales = JSON.parse(localStorage.getItem('store_sales') || '[]');

    function getNow() {
      const d = new Date();
      const date = d.toISOString().split('T')[0];
      const time = d.toTimeString().split(' ')[0].substring(0, 5);
      return { date, time };
    }

    function renderUI() {
      const today = new Date().toISOString().split('T')[0];
      let todaySum = 0;
      let todayCount = 0;

      const listContainer = document.getElementById('historyList');
      listContainer.innerHTML = '';

      sales.slice(0, 20).forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div class="item-info">
            <div class="name">${item.desc}</div>
            <div class="time">${item.date} • ${item.time} (${item.seller})</div>
          </div>
          <div class="item-amount">+${item.amount} TJS</div>
        `;
        listContainer.appendChild(div);
      });

      sales.forEach(item => {
        if (item.date === today) {
          todaySum += Number(item.amount) || 0;
          todayCount++;
        }
      });

      document.getElementById('todayTotal').innerText = todaySum + ' TJS';
      document.getElementById('todayCount').innerText = todayCount;
      document.getElementById('allCount').innerText = 'Локально: ' + sales.length;
    }

    async function submitSale() {
      const descInput = document.getElementById('desc');
      const amountInput = document.getElementById('amount');
      const sellerInput = document.getElementById('seller');
      const saveBtn = document.getElementById('saveBtn');
      const statusMsg = document.getElementById('statusMsg');

      const desc = descInput.value.trim() || 'Товар без названия';
      const amount = parseFloat(amountInput.value);

      if (!amount || isNaN(amount) || amount <= 0) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        alert('Введите корректную сумму');
        return;
      }

      const { date, time } = getNow();
      const payload = {
        date: date,
        time: time,
        desc: desc,
        amount: amount,
        seller: sellerInput.value
      };

      // 1. Быстро сохраняем локально для отзывчивости
      sales.unshift(payload);
      localStorage.setItem('store_sales', JSON.stringify(sales));
      renderUI();

      // Очищаем форму
      descInput.value = '';
      amountInput.value = '';
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      // 2. Отправляем в Google Таблицу через Google Apps Script
      saveBtn.disabled = true;
      statusMsg.innerText = 'Синхронизация с таблицей...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        statusMsg.innerText = '✓ Сохранено в Google Таблицу';
        setTimeout(() => { statusMsg.innerText = ''; }, 3000);
      } catch (err) {
        statusMsg.innerText = 'Ошибка отправки в таблицу (сохранено в телефоне)';
      } finally {
        saveBtn.disabled = false;
      }
    }

    renderUI();
  </script>
</body>
</html>
